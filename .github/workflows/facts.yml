name: Refresh facts and links

on:
  schedule:
    - cron: '17 3 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce fact freshness
        run: npm run facts:freshness
      - name: Probe public source links
        run: npm run links:check -- --network
