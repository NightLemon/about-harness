name: 教程失败
description: 报告可复现的教程、容器或命令失败
title: "[教程] "
labels: [documentation, reproduction]
body:
  - type: input
    id: page
    attributes:
      label: 教程页面与步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与固定版本
      description: OS、容器、Node、Python、浏览器、依赖锁版本。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 输入、命令、退出码与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与已尝试恢复
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: 数据安全
      options:
        - label: 我已移除凭据、私人路径、私人数据和未脱敏 trace
          required: true
